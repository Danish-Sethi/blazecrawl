[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blazecrawl"
version = "0.2.0"
description = "Python SDK for BlazeCrawl Core (self-hosted web-data engine)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["web-scraping", "crawler", "markdown", "llm", "sdk", "mcp", "self-hosted"]
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://github.com/Danish-Sethi/blazecrawl"
Repository = "https://github.com/Danish-Sethi/blazecrawl"
Issues = "https://github.com/Danish-Sethi/blazecrawl/issues"
Documentation = "https://github.com/Danish-Sethi/blazecrawl/tree/main/sdks/python"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.hatch.build.targets.wheel]
packages = ["blazecrawl"]
