[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blazecrawl-core"
version = "0.2.0"
description = "Security-first, self-hostable web-data engine: scrape, crawl, and map the web to clean Markdown."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "BlazeCrawl" }]
keywords = ["web-scraping", "crawler", "markdown", "llm", "ssrf", "self-hosted"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Minimal base: NO GCP, Vertex, BigQuery, Stripe, Pinecone/Qdrant/Chroma/
# Weaviate, Snowflake, SAML/SCIM. Those belong to optional extras or the
# commercial BlazeCrawl Cloud product and are not required for the core.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "playwright>=1.48.0",
    "readability-lxml>=0.8.1",
    "trafilatura>=1.12.0",
    "markdownify>=1.0.0",
    "lxml>=5.0.0",
    "chardet>=5.2.0",
    "beautifulsoup4>=4.12.0",
    "defusedxml>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/Danish-Sethi/blazecrawl"
Repository = "https://github.com/Danish-Sethi/blazecrawl"
Issues = "https://github.com/Danish-Sethi/blazecrawl/issues"
Documentation = "https://github.com/Danish-Sethi/blazecrawl/tree/main/docs"
Changelog = "https://github.com/Danish-Sethi/blazecrawl/blob/main/CHANGELOG.md"

[project.optional-dependencies]
redis = ["redis[hiredis]>=5.0.0"]
structured = ["extruct>=0.16.0"]
metrics = ["prometheus-client>=0.21.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[project.scripts]
blazecrawl = "blazecrawl_core.cli:main"
blazecrawl-server = "blazecrawl_core.api.main:main"

[tool.hatch.build.targets.wheel]
packages = ["blazecrawl_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
