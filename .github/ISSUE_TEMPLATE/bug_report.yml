name: Bug Report
description: Report something BlazeCrawl Core claims to do but does incorrectly or insecurely
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Security issues → see SECURITY.md (do NOT file publicly).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected vs what happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands/requests/code. Include the target URL class (public page, JS-heavy, etc.).
    validations:
      required: true
  - type: textarea
    id: ready
    attributes:
      label: Output of GET /ready
      description: Paste the JSON.
  - type: input
    id: version
    attributes:
      label: BlazeCrawl version
      description: Output of `blazecrawl --version` or the image tag.
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Install method
      options: ["docker (published image)", "docker compose (from source)", "pip (blazecrawl-core)", "other"]
  - type: input
    id: os
    attributes:
      label: OS / runtime
      description: e.g. Ubuntu 24.04, Python 3.12, Node 22, Docker 27.
      placeholder: Ubuntu 24.04, Python 3.12
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste logs with any API keys, tokens, or credentials removed.
      render: text
