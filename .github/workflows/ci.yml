name: CI

# CI validates untrusted pull requests and never needs repository write access.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  python:
    name: Python (lint, type, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install (dev and metrics extras)
        run: uv sync --extra dev --extra metrics
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Ruff lint
        run: uv run ruff check blazecrawl_core scripts/release tests/test_release_versions.py
      - name: Ruff format check
        run: uv run ruff format --check blazecrawl_core scripts/release tests/test_release_versions.py
      - name: Tests
        run: uv run pytest -q
      - name: Build wheel
        run: uv build

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install
        run: cd sdks/python && uv sync --extra dev
      - name: Import check
        run: cd sdks/python && uv run python -c "import blazecrawl; print(blazecrawl.__version__)"

  node:
    name: Node SDK + MCP (lint/typecheck/test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Node SDK syntax + tests
        run: |
          node --check sdks/node/src/index.js
          cd sdks/node && npm test
      - name: Node MCP syntax
        run: node --check mcp/node/src/index.js

  python-mcp:
    name: Python MCP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install
        run: cd mcp/python && uv sync
      - name: Import check
        run: cd mcp/python && uv run python -c "from blazecrawl_mcp import server; print('mcp ok')"

  docker-smoke:
    name: Docker quickstart smoke (OSS-J1/J2/J5)
    runs-on: ubuntu-24.04
    env:
      BLAZECRAWL_API_KEY: ci-local-test-key-not-a-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build + up
        run: docker compose up --build -d
      - name: Wait for health
        run: |
          set -euo pipefail
          healthy=false
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then
              healthy=true
              break
            fi
            sleep 2
          done
          [ "$healthy" = true ] || { docker compose logs api; exit 1; }
      - name: Scrape + SSRF gate
        run: |
          # CI supplies an ephemeral key instead of reading a credential from logs.
          KEY="${BLAZECRAWL_API_KEY}"
          curl -fsS -X POST http://localhost:8000/v1/scrape \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"url":"https://example.com"}' | grep -q "Example Domain"
          # SSRF must be rejected
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/v1/scrape \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"url":"http://127.0.0.1/"}')
          [ "$code" = "400" ]
      - name: Down
        if: always()
        run: docker compose down -v

  security:
    name: Security (secrets, deps, licenses)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Dependency vulnerability audit
        run: |
          uv sync --extra dev
          uv tool run pip-audit --progress-spinner off
      - name: License inventory
        run: |
          uv sync
          uv tool run --from pip-licenses pip-licenses --format=markdown --with-urls
      - name: Secret scan
        run: |
          # grep-based guard: no live-looking secrets in tracked files
          ! grep -rnoE 'sk_live_[A-Za-z0-9]{10,}|xox[baprs]-[A-Za-z0-9-]+|ghp_[A-Za-z0-9]{30,}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----' . \
            --exclude-dir=.git --exclude-dir=.venv
