name: Release

# PRs/manual candidates are read-only. Publication is possible only on a reviewed tag.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only check: build candidate or check already-public registries"
        type: choice
        options: [candidate, published]
        default: candidate
        required: true
      version:
        description: "Exact X.Y.Z matching this ref's five manifests and locks"
        default: "0.2.0"
        required: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  verify-release:
    name: Verify release versions and tag ancestry
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version="${GITHUB_REF_NAME#v}"
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            version="${REQUESTED_VERSION:-$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')}"
          fi
          python scripts/release/versions.py "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  candidate:
    name: Clean candidate (all five packages + Linux amd64 image)
    if: ${{ inputs.mode != 'published' }}
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check release runtime and Node tests
        run: |
          node --version
          npm --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'
          npm --prefix sdks/node test
          node --test mcp/node/test/*.test.mjs
      - name: Build and exercise exact installed artifacts
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
        run: bash scripts/release/artifacts.sh built "$VERSION"
      - name: Inventory the tested image
        uses: anchore/sbom-action@3f46e6c23709f2b35c9c5182affe8ef3d6e32b71
        with:
          image: blazecrawl-candidate:${{ needs.verify-release.outputs.version }}
          format: spdx-json
          output-file: release-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*
            sdks/python/dist/*
            mcp/python/dist/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-distributions
          path: |
            sdks/node/*.tgz
            mcp/node/*.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image
          path: |
            release-image.tar
            release-image.spdx.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  publish-pypi-core:
    name: Publish blazecrawl-core to PyPI
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [verify-release, candidate]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: artifacts
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: artifacts/dist

  publish-pypi-sdk:
    name: Publish blazecrawl SDK to PyPI
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [verify-release, candidate]
    runs-on: ubuntu-24.04
    environment: release-pypi-blazecrawl
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: artifacts
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: artifacts/sdks/python/dist

  publish-pypi-mcp:
    name: Publish blazecrawl MCP to PyPI
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [verify-release, candidate]
    runs-on: ubuntu-24.04
    environment: release-pypi-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: artifacts
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: artifacts/mcp/python/dist

  publish-npm:
    name: Publish exact npm packs (OIDC only, candidate dist-tag)
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [verify-release, candidate]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-distributions
          path: artifacts
      - name: Publish with provenance, no token fallback
        run: |
          set -euo pipefail
          node --version
          npm --version
          node - "$(npm --version)" <<'NODE'
          const [major, minor, patch] = process.argv[2].split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error("npm Trusted Publishing requires npm >=11.5.1");
          }
          NODE
          npm publish artifacts/sdks/node/*.tgz --access public --provenance --tag candidate
          npm publish artifacts/mcp/node/*.tgz --access public --provenance --tag candidate

  publish-ghcr:
    name: Push exact tested image (version tag only)
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [verify-release, candidate]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load, tag and push without rebuilding
        id: image
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          set -euo pipefail
          docker load -i release-image.tar
          docker tag "blazecrawl-candidate:$VERSION" "ghcr.io/danish-sethi/blazecrawl:$VERSION"
          docker push "ghcr.io/danish-sethi/blazecrawl:$VERSION"
          reference="$(docker image inspect "ghcr.io/danish-sethi/blazecrawl:$VERSION" --format '{{index .RepoDigests 0}}')"
          printf 'digest=%s\n' "${reference##*@}" >> "$GITHUB_OUTPUT"
      - name: Attest tested image provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-name: ghcr.io/danish-sethi/blazecrawl
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest tested image SBOM
        uses: actions/attest-sbom@4c8abdcbea4a6b66f70fd1169e70af4bf5b13701
        with:
          subject-name: ghcr.io/danish-sethi/blazecrawl
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: release-image.spdx.json
          push-to-registry: true

  published:
    name: Anonymous public-registry behavior checks
    if: ${{ always() && needs.verify-release.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'published') || (github.event_name == 'push' && needs.publish-pypi-core.result == 'success' && needs.publish-pypi-sdk.result == 'success' && needs.publish-pypi-mcp.result == 'success' && needs.publish-npm.result == 'success' && needs.publish-ghcr.result == 'success')) }}
    needs: [verify-release, publish-pypi-core, publish-pypi-sdk, publish-pypi-mcp, publish-npm, publish-ghcr]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install only public packages and anonymously pull versioned image
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
        run: bash scripts/release/artifacts.sh registry "$VERSION"
      # No latest mutation or release announcement. The coordinator does that
      # only after this job and independent public-registry evidence are green.
